name: ci

on:
  push:
    branches:
      - main
  pull_request: ~

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Turns rustc, clippy, rustfmt, test panic and rust-lld errors in the
      # log into annotations on the PR diff.
      - run: echo "::add-matcher::.github/rust-matchers.json"

      # rustup reads rust-toolchain.toml and installs the pinned stable, with
      # rustfmt, clippy and both micro:bit targets, the first time cargo runs.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-

      - run: cargo fmt --check
      # On the host, where every firmware compiles as a stub.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Clippy on both micro:bit targets, then every firmware for both
      # boards, writing target/firmware/<name>-<board>.{hex,elf}. The
      # --locked steps above have already checked Cargo.lock.
      - run: cargo xtask check

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: firmware
          path: |
            target/firmware/*.hex
            target/firmware/*.elf
          if-no-files-found: error
