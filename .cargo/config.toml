[alias]
# Builds, sizes, hex files and flashing for everything in firmware/. See
# xtask/src/main.rs.
xtask = "run --quiet --package xtask --"

# No [build] target: the host stays the default, so `cargo test --workspace`
# and `cargo clippy --workspace` run there with every firmware as a stub. The
# linker scripts come from each firmware's build.rs, so there are no rustflags
# here either.
