[package]
name = "maze"
description = "A tilt maze: roll a marble through a maze bigger than the screen."
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
v1 = ["board/v1"]
v2 = ["board/v2"]

[dependencies]
board = { path = "../../board" }

# Only on the boards, so the host build has no runtime or panic handler to
# clash with std's.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"

[[bin]]
name = "maze"
test = false
bench = false

[lints]
workspace = true
